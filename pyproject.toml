[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-research-lab"
version = "0.1.0"
description = "Recorded, isolated execution for autonomous computational research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arl = "autonomous_research_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonomous_research_lab = ["static/*.html", "static/*.js", "static/*.css"]
